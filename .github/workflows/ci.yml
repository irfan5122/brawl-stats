name: Brawl Stats CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-check:
    name: Python backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

  frontend-build:
    name: React frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: [backend-check, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Local deploy script failed at line ${LINENO} (exit ${rc})"; exit "$rc"' ERR

          echo "STEP 0: Checking required deployment secrets"
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"

          echo "STEP 1: Preparing SSH directory"
          install -m 700 -d "$HOME/.ssh"

          echo "STEP 2: Writing SSH private key"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          echo "STEP 3: Validating SSH private key format"
          ssh-keygen -y -f "$HOME/.ssh/ec2_key" > /dev/null

          echo "STEP 4: Scanning EC2 host key"
          ssh-keyscan -T 10 -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          echo "STEP 5: Connecting to EC2 and running deployment"
          ssh -i "$HOME/.ssh/ec2_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          trap 'rc=$?; echo "ERROR: Remote deployment failed at line ${LINENO} (exit ${rc})"; exit "$rc"' ERR

          echo "REMOTE STEP 1: Entering repository"
          cd /opt/brawl-stats

          echo "REMOTE STEP 2: Pulling latest main"
          git pull --ff-only origin main

          echo "REMOTE STEP 3: Installing frontend dependencies"
          cd frontend
          npm ci

          echo "REMOTE STEP 4: Building frontend"
          npm run build

          echo "REMOTE STEP 5: Installing backend dependencies"
          cd ../backend
          ../backend/.venv/bin/pip install -r requirements.txt

          echo "REMOTE STEP 6: Restarting backend service"
          sudo systemctl restart brawl-stats

          echo "REMOTE STEP 7: Checking backend service"
          sudo systemctl is-active --quiet brawl-stats

          echo "REMOTE STEP 8: Testing Nginx configuration"
          sudo nginx -t

          echo "REMOTE STEP 9: Reloading Nginx"
          sudo systemctl reload nginx

          echo "REMOTE STEP 10: Checking API health endpoint"
          curl --show-error --fail --silent \
            --retry 5 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1/api/health

          echo
          echo "DEPLOYMENT SUCCESS"
          REMOTE
